<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Fantasy Pet Online - Genshin-style Pet MMORPG WebApp" />
  <meta name="screen-orientation" content="landscape" />
  <title>Fantasy Pet Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E1A;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      color: #ECE8E0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0F1428 0%, #0A0E1A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      text-shadow: 0 0 30px rgba(232, 201, 106, 0.5), 0 0 60px rgba(232, 201, 106, 0.2);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .loading-bar-container {
      width: 60%;
      max-width: 300px;
      height: 3px;
      background: rgba(232, 201, 106, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #F0D878);
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.6);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .loading-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(232, 201, 106, 0.4);
      letter-spacing: 3px;
      margin-top: 20px;
      font-weight: 500;
    }

    /* ===== STONE AGE DESIGN SYSTEM ===== */
    .sa-frame {
      background: linear-gradient(180deg, #F5E6C8 0%, #E8D5B0 100%);
      border: 2px solid #8B7355;
      border-radius: 4px;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* ===== FLOATING PORTRAIT RINGS (no BG) ===== */
    .hud-portrait {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .hud-portrait-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #E06060;
      background: radial-gradient(circle, rgba(30, 25, 40, 0.85), rgba(15, 12, 25, 0.92));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5), inset 0 0 8px rgba(100, 80, 180, 0.15);
      overflow: hidden;
    }

    /* ===== NAV BUTTONS ===== */
    .sa-nav-btn {
      padding: 5px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(232, 201, 106, 0.85);
      background: transparent;
      border: none;
      border-right: 1px solid rgba(196, 153, 61, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      transition: all 0.12s;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .sa-nav-btn:first-child {
      border-radius: 4px 0 0 4px;
    }

    .sa-nav-btn:last-child {
      border-radius: 0 4px 4px 0;
      border-right: none;
    }

    .sa-nav-btn:hover {
      background: rgba(196, 153, 61, 0.15);
      color: #FFD700;
    }

    .sa-nav-btn:active {
      transform: scale(0.95);
    }

    /* ===== DARK SKILL SLOT ===== */
    .dark-skill-slot {
      width: 44px;
      height: 44px;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: all 0.12s;
    }

    .dark-skill-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(232, 201, 106, 0.06);
    }

    .dark-skill-key {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 8px;
      color: rgba(200, 195, 185, 0.35);
      font-weight: 600;
    }

    /* ===== DARK CHAT INPUT ===== */
    .dark-chat-input {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px;
      background: rgba(15, 12, 25, 0.5);
      color: rgba(220, 215, 200, 0.8);
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .dark-chat-input::placeholder {
      color: rgba(200, 195, 185, 0.3);
    }

    .dark-btn-sm {
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(160, 130, 80, 0.2);
      color: rgba(232, 201, 106, 0.8);
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .dark-btn-sm:hover {
      background: rgba(160, 130, 80, 0.35);
    }

    /* ===== PET PANEL (Dark Premium Monster Info) ===== */
    .sa-panel {
      background: linear-gradient(180deg, rgba(25, 20, 38, 0.94), rgba(15, 12, 25, 0.96));
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 6px;
      box-shadow: 2px 2px 16px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      pointer-events: auto;
      overflow: hidden;
      max-height: 85vh;
    }

    .sa-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: linear-gradient(180deg, rgba(40, 30, 55, 0.9), rgba(25, 20, 38, 0.95));
      color: rgba(232, 201, 106, 0.9);
      font-weight: 700;
      font-size: 13px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 5px 5px 0 0;
    }

    .sa-sec {
      padding: 3px 8px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.15);
      background: transparent;
    }

    .sa-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(160, 130, 80, 0.12);
      border: 1px solid rgba(160, 130, 80, 0.25);
      border-radius: 3px;
      color: rgba(200, 195, 185, 0.6);
      cursor: pointer;
    }

    .sa-tag-active {
      background: rgba(160, 130, 80, 0.25);
      color: rgba(232, 201, 106, 0.9);
      border-color: rgba(160, 130, 80, 0.4);
    }

    .sa-pet-portrait-lg {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(160, 130, 80, 0.3);
      background: radial-gradient(circle, rgba(30, 25, 40, 0.8), rgba(15, 12, 25, 0.9));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stats (compact dark) */
    .sa-sr {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 1px 0;
      font-size: 11px;
    }

    .sa-sl {
      display: inline-block;
      width: 44px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.8);
      background: rgba(160, 130, 80, 0.12);
      border: 1px solid rgba(160, 130, 80, 0.25);
      padding: 1px 3px;
      font-size: 10px;
      text-align: center;
      border-radius: 2px;
    }

    .sa-sv {
      display: inline-block;
      min-width: 40px;
      font-weight: 600;
      color: rgba(220, 215, 200, 0.75);
      font-size: 11px;
      text-align: right;
      padding: 0 3px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.1);
    }

    /* Equipment slots (dark) */
    .sa-equip-slot {
      width: 36px;
      height: 36px;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.25);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* Mini portraits */
    .sa-mini-portrait {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(160, 130, 80, 0.3);
      background: rgba(20, 16, 30, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    /* Pet storage grid (dark) */
    .sa-pet-slot {
      width: 38px;
      height: 38px;
      background: rgba(20, 16, 30, 0.5);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
    }

    .sa-pet-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(232, 201, 106, 0.06);
    }

    .sa-pet-slot-deploy {
      border: 2px solid rgba(196, 153, 61, 0.5);
      background: rgba(196, 153, 61, 0.08);
      box-shadow: 0 0 6px rgba(196, 153, 61, 0.15);
    }

    /* Buff slots (dark) */
    .sa-buff-slot {
      width: 32px;
      height: 32px;
      background: rgba(20, 16, 30, 0.5);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 7px;
    }

    /* Panel Backdrop */
    .panel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 290;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .panel-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Keep old panel class for PanelManager compatibility */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      z-index: 300;
      transition: transform 0.25s, opacity 0.25s;
    }

    .panel.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-title">Fantasy Pet Online</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
    <div class="loading-text">ENTERING THE FANTASY WORLD...</div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="ui-layer"></div>
  <div class="panel-backdrop" id="panelBackdrop"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
