<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Fantasy Pet Online - Genshin-style Pet MMORPG WebApp" />
  <meta name="screen-orientation" content="landscape" />
  <title>Fantasy Pet Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E1A;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      color: #ECE8E0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0F1428 0%, #0A0E1A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      text-shadow: 0 0 30px rgba(232, 201, 106, 0.5), 0 0 60px rgba(232, 201, 106, 0.2);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .loading-bar-container {
      width: 60%;
      max-width: 300px;
      height: 3px;
      background: rgba(232, 201, 106, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #F0D878);
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.6);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .loading-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(232, 201, 106, 0.4);
      letter-spacing: 3px;
      margin-top: 20px;
      font-weight: 500;
    }

    /* ===== HUD TOP BAR ===== */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 100;
    }

    .hud-hp {
      width: 120px;
      height: 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .hud-hp-fill {
      height: 100%;
      border-radius: 4px;
      width: 100%;
      background: linear-gradient(90deg, #C0392B, #E74C3C);
      box-shadow: 0 0 6px rgba(231, 76, 60, 0.4);
      transition: width 0.3s;
    }

    .hud-mp {
      width: 100px;
      height: 6px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .hud-mp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2471A3, #3498DB);
      box-shadow: 0 0 4px rgba(52, 152, 219, 0.3);
      transition: width 0.3s;
    }

    .hud-stat {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #ECE8E0;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .hud-gold {
      color: #E8C96A;
      font-weight: 600;
    }

    .hud-zone {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      color: rgba(232, 201, 106, 0.7);
      margin-left: auto;
    }

    /* ===== BOTTOM NAV BAR ===== */
    .hud-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      z-index: 100;
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(180, 200, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      background: rgba(232, 201, 106, 0.08);
      border-color: rgba(232, 201, 106, 0.15);
    }

    .nav-btn:active {
      transform: scale(0.9);
    }

    .nav-btn.active {
      background: rgba(232, 201, 106, 0.12);
      border-color: rgba(232, 201, 106, 0.25);
    }

    .nav-btn img {
      width: 22px;
      height: 22px;
      opacity: 0.7;
      filter: brightness(1.2);
      object-fit: contain;
    }

    /* ===== CENTERED PANEL ===== */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      z-index: 300;
      background: rgba(15, 20, 40, 0.92);
      border: 1px solid rgba(180, 200, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s;
      max-width: 85vw;
      max-height: 80vh;
      overflow-y: auto;
    }

    .panel.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Panel Backdrop */
    .panel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 290;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .panel-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-title">Fantasy Pet Online</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
    <div class="loading-text">ENTERING THE FANTASY WORLD...</div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="ui-layer"></div>
  <div class="panel-backdrop" id="panelBackdrop"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
