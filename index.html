<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Fantasy Pet Online - Genshin-style Pet MMORPG WebApp" />
  <meta name="screen-orientation" content="landscape" />
  <title>Fantasy Pet Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E1A;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      color: #ECE8E0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0F1428 0%, #0A0E1A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      text-shadow: 0 0 30px rgba(232, 201, 106, 0.5), 0 0 60px rgba(232, 201, 106, 0.2);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .loading-bar-container {
      width: 60%;
      max-width: 300px;
      height: 3px;
      background: rgba(232, 201, 106, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #F0D878);
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.6);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .loading-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(232, 201, 106, 0.4);
      letter-spacing: 3px;
      margin-top: 20px;
      font-weight: 500;
    }

    /* Panel Backdrop */
    .panel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 290;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .panel-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-title">Fantasy Pet Online</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
    <div class="loading-text">ENTERING THE FANTASY WORLD...</div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="ui-layer"></div>
  <div class="panel-backdrop" id="panelBackdrop"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
