<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Fantasy Pet Online - Genshin-style Pet MMORPG WebApp" />
  <meta name="screen-orientation" content="landscape" />
  <title>Fantasy Pet Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E1A;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      color: #ECE8E0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0F1428 0%, #0A0E1A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      text-shadow: 0 0 30px rgba(232, 201, 106, 0.5), 0 0 60px rgba(232, 201, 106, 0.2);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .loading-bar-container {
      width: 60%;
      max-width: 300px;
      height: 3px;
      background: rgba(232, 201, 106, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #F0D878);
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.6);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .loading-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(232, 201, 106, 0.4);
      letter-spacing: 3px;
      margin-top: 20px;
      font-weight: 500;
    }

    /* ===== STONE AGE DESIGN SYSTEM ===== */
    .sa-frame {
      background: linear-gradient(180deg, #F5E6C8 0%, #E8D5B0 100%);
      border: 2px solid #8B7355;
      border-radius: 4px;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* ===== PORTRAITS ===== */
    .sa-portrait-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .sa-portrait {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #CC3333;
      background: #D4C4A0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.3), inset 0 0 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .sa-bar {
      width: 54px;
      height: 5px;
      background: #5C3D1A;
      border-radius: 2px;
      overflow: hidden;
    }

    .sa-bar-fill {
      height: 100%;
      transition: width 0.3s;
    }

    .sa-bar-hp-fill {
      background: linear-gradient(90deg, #CCAA00, #FFD700);
    }

    .sa-bar-mp-fill {
      background: linear-gradient(90deg, #AA2222, #DD4444);
    }

    /* ===== MINI PORTRAITS ===== */
    .sa-mini-portrait {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #999;
      background: #D4C4A0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ===== NAV BUTTONS ===== */
    .sa-nav-btn {
      padding: 8px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #F5E6C8;
      background: linear-gradient(180deg, #8B6B3D 0%, #6B4E2A 100%);
      border: 1px solid #5C3D1A;
      border-right: 1px solid #A08050;
      cursor: pointer;
      transition: all 0.1s;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .sa-nav-btn:first-child {
      border-radius: 4px 0 0 4px;
    }

    .sa-nav-btn:last-child {
      border-radius: 0 4px 4px 0;
      border-right: 1px solid #5C3D1A;
    }

    .sa-nav-btn:hover {
      background: linear-gradient(180deg, #A07840 0%, #7B5E3A 100%);
    }

    .sa-nav-btn:active {
      transform: scale(0.95);
    }

    /* ===== TOGGLE / COLLAPSIBLE ===== */
    .sa-toggle-btn {
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      color: #5C3D1A;
      cursor: pointer;
      border-bottom: 1px solid #C4A97D;
    }

    .sa-toggle-btn-mini {
      cursor: pointer;
      font-size: 10px;
      color: #8B7355;
    }

    /* ===== SKILL BAR ===== */
    .sa-skill-slot {
      width: 48px;
      height: 48px;
      background: #D4C4A0;
      border: 2px solid #8B7355;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
    }

    .sa-skill-slot:hover {
      border-color: #C4993D;
    }

    .sa-skill-label {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 8px;
      color: #8B7355;
      font-weight: 600;
    }

    /* ===== CHAT BOX ===== */
    .sa-chat-tabs {
      display: flex;
      gap: 8px;
      padding: 4px 6px;
      border-bottom: 1px solid #C4A97D;
    }

    .sa-chat-tab {
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.7;
    }

    .sa-chat-tab:hover {
      opacity: 1;
    }

    .sa-chat-messages {
      height: 100px;
      overflow-y: auto;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.08);
      scrollbar-width: thin;
    }

    .sa-chat-input-row {
      display: flex;
      gap: 4px;
      padding: 4px 6px;
    }

    .sa-chat-input {
      flex: 1;
      padding: 4px 6px;
      font-size: 11px;
      border: 1px solid #C4A97D;
      border-radius: 3px;
      background: #F5E6C8;
      color: #5C3D1A;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .sa-btn-sm {
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 600;
      background: linear-gradient(180deg, #8B6B3D, #6B4E2A);
      color: #F5E6C8;
      border: 1px solid #5C3D1A;
      border-radius: 3px;
      cursor: pointer;
    }

    /* ===== PET PANEL (Stone Age Monster Info) ===== */
    .sa-panel {
      background: linear-gradient(180deg, #F5E6C8 0%, #E8D5B0 100%);
      border: 2px solid #8B7355;
      border-radius: 6px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      pointer-events: auto;
      overflow-y: auto;
      max-height: 85vh;
    }

    .sa-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(180deg, #8B6B3D, #6B4E2A);
      color: #F5E6C8;
      font-weight: 700;
      font-size: 13px;
      border-bottom: 2px solid #5C3D1A;
      border-radius: 4px 4px 0 0;
    }

    .sa-section {
      padding: 6px 10px;
      border-bottom: 1px solid #C4A97D;
    }

    .sa-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      background: #D4C4A0;
      border: 1px solid #C4A97D;
      border-radius: 3px;
      color: #5C3D1A;
      cursor: pointer;
    }

    .sa-tag-active {
      background: #8B6B3D;
      color: #F5E6C8;
      border-color: #5C3D1A;
    }

    .sa-pet-portrait-lg {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid #8B7355;
      background: #D4C4A0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stats */
    .sa-stat-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
      font-size: 12px;
    }

    .sa-stat-label {
      display: inline-block;
      width: 48px;
      font-weight: 600;
      color: #5C3D1A;
      background: #D4C4A0;
      border: 1px solid #C4A97D;
      padding: 1px 4px;
      font-size: 11px;
      text-align: center;
      border-radius: 2px;
    }

    .sa-stat-val {
      display: inline-block;
      min-width: 48px;
      font-weight: 500;
      color: #3D2A10;
      font-size: 12px;
      text-align: right;
      padding: 0 4px;
    }

    /* Equipment slots */
    .sa-equip-slot {
      width: 42px;
      height: 42px;
      background: #D4C4A0;
      border: 2px solid #8B7355;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
    }

    /* Pet storage grid */
    .sa-pet-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .sa-pet-slot {
      width: 38px;
      height: 38px;
      background: #D4C4A0;
      border: 1px solid #C4A97D;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .sa-pet-slot:hover {
      border-color: #8B6B3D;
    }

    .sa-pet-slot-deploy {
      border: 2px solid #C4993D;
      background: #E8D5B0;
      box-shadow: 0 0 4px rgba(196, 153, 61, 0.3);
    }

    /* Buff slots */
    .sa-buff-slot {
      width: 38px;
      height: 38px;
      background: #D4C4A0;
      border: 1px solid #C4A97D;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* Panel Backdrop */
    .panel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 290;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .panel-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Keep old panel class for PanelManager compatibility */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      z-index: 300;
      transition: transform 0.25s, opacity 0.25s;
    }

    .panel.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-title">Fantasy Pet Online</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
    <div class="loading-text">ENTERING THE FANTASY WORLD...</div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="ui-layer"></div>
  <div class="panel-backdrop" id="panelBackdrop"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
