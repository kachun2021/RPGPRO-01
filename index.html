<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Fantasy Pet Online - Genshin-style Pet MMORPG WebApp" />
  <meta name="screen-orientation" content="landscape" />
  <title>Fantasy Pet Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E1A;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      color: #ECE8E0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0F1428 0%, #0A0E1A 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      text-shadow: 0 0 30px rgba(232, 201, 106, 0.5), 0 0 60px rgba(232, 201, 106, 0.2);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .loading-bar-container {
      width: 60%;
      max-width: 300px;
      height: 3px;
      background: rgba(232, 201, 106, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #F0D878);
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.6);
      border-radius: 2px;
      transition: width 0.3s ease-out;
    }

    .loading-text {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: rgba(232, 201, 106, 0.4);
      letter-spacing: 3px;
      margin-top: 20px;
      font-weight: 500;
    }

    /* ===== STONE AGE DESIGN SYSTEM ===== */
    .sa-frame {
      background: linear-gradient(180deg, #F5E6C8 0%, #E8D5B0 100%);
      border: 2px solid #8B7355;
      border-radius: 4px;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* ===== FLOATING PORTRAIT RINGS (no BG) ===== */
    .hud-portrait {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 50px;
    }

    /* Circle area container (SVG + inner are absolute inside this) */
    .hud-portrait-circle {
      position: relative;
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    .hud-portrait-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, rgba(30, 25, 40, 0.9), rgba(15, 12, 25, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* EXP bar above each portrait */
    .hud-exp-track {
      width: 100%;
      height: 4px;
      background: rgba(20, 16, 30, 0.7);
      border-radius: 2px;
      border: 1px solid rgba(160, 130, 80, 0.3);
      margin-bottom: 1px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hud-exp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C4993D, #E8C96A, #FFD700);
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 4px rgba(232, 201, 106, 0.4);
    }

    /* Bag page navigation */
    .inv2-page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 3px 0;
    }

    .inv2-page-btn {
      background: rgba(25, 20, 38, 0.8);
      border: 1px solid rgba(160, 130, 80, 0.25);
      color: rgba(232, 201, 106, 0.8);
      border-radius: 3px;
      width: 24px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inv2-page-btn:hover {
      border-color: rgba(232, 201, 106, 0.5);
    }

    .inv2-page-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .inv2-page-label {
      font-size: 10px;
      color: rgba(200, 195, 185, 0.6);
      font-family: 'Inter', sans-serif;
    }

    /* ===== NAV BUTTONS ===== */
    .sa-nav-btn {
      padding: 5px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(232, 201, 106, 0.85);
      background: transparent;
      border: none;
      border-right: 1px solid rgba(196, 153, 61, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      transition: all 0.12s;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .sa-nav-btn:first-child {
      border-radius: 4px 0 0 4px;
    }

    .sa-nav-btn:last-child {
      border-radius: 0 4px 4px 0;
      border-right: none;
    }

    .sa-nav-btn:hover {
      background: rgba(196, 153, 61, 0.15);
      color: #FFD700;
    }

    .sa-nav-btn:active {
      transform: scale(0.95);
    }

    /* ===== DARK SKILL SLOT ===== */
    .dark-skill-slot {
      width: 44px;
      height: 44px;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: all 0.12s;
    }

    .dark-skill-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(232, 201, 106, 0.06);
    }

    .dark-skill-key {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 8px;
      color: rgba(200, 195, 185, 0.35);
      font-weight: 600;
    }

    /* ===== DARK CHAT INPUT ===== */
    .dark-chat-input {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px;
      background: rgba(15, 12, 25, 0.5);
      color: rgba(220, 215, 200, 0.8);
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .dark-chat-input::placeholder {
      color: rgba(200, 195, 185, 0.3);
    }

    .dark-btn-sm {
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(160, 130, 80, 0.2);
      color: rgba(232, 201, 106, 0.8);
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .dark-btn-sm:hover {
      background: rgba(160, 130, 80, 0.35);
    }

    /* ===== PET PANEL (Dark Premium Monster Info) ===== */
    .sa-panel {
      background: linear-gradient(180deg, rgba(25, 20, 38, 0.94), rgba(15, 12, 25, 0.96));
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 6px;
      box-shadow: 2px 2px 16px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      pointer-events: auto;
      overflow: hidden;
      max-height: 85vh;
    }

    .sa-panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: linear-gradient(180deg, rgba(40, 30, 55, 0.9), rgba(25, 20, 38, 0.95));
      color: rgba(232, 201, 106, 0.9);
      font-weight: 700;
      font-size: 13px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 5px 5px 0 0;
      position: relative;
    }

    /* Global close button — top-right of title bar */
    .panel-close {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: rgba(200, 195, 185, 0.5);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      line-height: 1;
    }

    .panel-close:hover {
      color: #E74C3C;
      background: rgba(231, 76, 60, 0.15);
    }

    /* ===== QUEST TRACKER (mini HUD widget) ===== */
    .quest-tracker {
      position: fixed;
      left: 310px;
      top: 8px;
      width: 220px;
      z-index: 80;
      pointer-events: auto;
      font-family: 'Inter', sans-serif;
    }

    .qt-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: rgba(20, 16, 30, 0.85);
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    .qt-header-text {
      font-size: 10px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.7);
      flex: 1;
    }

    .qt-toggle {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.4);
      transition: transform 0.2s;
    }

    .qt-body {
      background: rgba(20, 16, 30, 0.8);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-top: none;
      border-radius: 0 0 4px 4px;
      overflow: hidden;
      transition: max-height 0.25s ease;
    }

    .qt-body.collapsed {
      max-height: 0 !important;
      border-bottom: none;
    }

    .qt-quest {
      padding: 4px 8px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.08);
    }

    .qt-quest:last-child {
      border-bottom: none;
    }

    .qt-quest-name {
      font-size: 10px;
      font-weight: 600;
      color: rgba(220, 215, 200, 0.7);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .qt-quest-obj {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.4);
      margin-bottom: 2px;
    }

    .qt-pbar {
      height: 4px;
      background: rgba(20, 16, 30, 0.6);
      border-radius: 2px;
      overflow: hidden;
    }

    .qt-pfill {
      height: 100%;
      background: linear-gradient(90deg, #C4993D, #E8C96A);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .qt-empty {
      padding: 6px 8px;
      font-size: 9px;
      color: rgba(200, 195, 185, 0.25);
      text-align: center;
    }

    .sa-sec {
      padding: 3px 8px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.15);
      background: transparent;
    }

    .sa-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(160, 130, 80, 0.12);
      border: 1px solid rgba(160, 130, 80, 0.25);
      border-radius: 3px;
      color: rgba(200, 195, 185, 0.6);
      cursor: pointer;
    }

    .sa-tag-active {
      background: rgba(160, 130, 80, 0.25);
      color: rgba(232, 201, 106, 0.9);
      border-color: rgba(160, 130, 80, 0.4);
    }

    .sa-pet-portrait-lg {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(160, 130, 80, 0.3);
      background: radial-gradient(circle, rgba(30, 25, 40, 0.8), rgba(15, 12, 25, 0.9));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stats (compact dark) */
    .sa-sr {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 1px 0;
      font-size: 11px;
    }

    .sa-sl {
      display: inline-block;
      width: 44px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.8);
      background: rgba(160, 130, 80, 0.12);
      border: 1px solid rgba(160, 130, 80, 0.25);
      padding: 1px 3px;
      font-size: 10px;
      text-align: center;
      border-radius: 2px;
    }

    .sa-sv {
      display: inline-block;
      min-width: 40px;
      font-weight: 600;
      color: rgba(220, 215, 200, 0.75);
      font-size: 11px;
      text-align: right;
      padding: 0 3px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.1);
    }

    /* Equipment slots (dark) */
    .sa-equip-slot {
      width: 36px;
      height: 36px;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.25);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* Mini portraits */
    .sa-mini-portrait {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(160, 130, 80, 0.3);
      background: rgba(20, 16, 30, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    /* Pet storage grid (dark) */
    .sa-pet-slot {
      width: 38px;
      height: 38px;
      background: rgba(20, 16, 30, 0.5);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
    }

    .sa-pet-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(232, 201, 106, 0.06);
    }

    .sa-pet-slot-deploy {
      border: 2px solid rgba(196, 153, 61, 0.5);
      background: rgba(196, 153, 61, 0.08);
      box-shadow: 0 0 6px rgba(196, 153, 61, 0.15);
    }

    /* Buff slots (dark) */
    .sa-buff-slot {
      width: 32px;
      height: 32px;
      background: rgba(20, 16, 30, 0.5);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 7px;
    }

    /* Panel Backdrop */
    .panel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 290;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s;
    }

    .panel-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Keep old panel class for PanelManager compatibility */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      z-index: 300;
      transition: transform 0.25s, opacity 0.25s;
    }

    .panel.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* ===== P5 COMBAT: Monster HP Bars ===== */
    .monster-hp-bar {
      position: absolute;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 180;
      text-align: center;
      min-width: 60px;
    }

    .monster-hp-bar .mon-hp-name {
      font-size: 10px;
      font-weight: 600;
      color: rgba(220, 215, 200, 0.8);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .monster-hp-bar.boss .mon-hp-name {
      color: #E8C96A;
      font-size: 12px;
      font-weight: 800;
    }

    .mon-hp-track {
      width: 50px;
      height: 4px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
    }

    .monster-hp-bar.boss .mon-hp-track {
      width: 80px;
      height: 6px;
      border: 1px solid rgba(232, 201, 106, 0.4);
    }

    .mon-hp-fill {
      height: 100%;
      background: #E74C3C;
      border-radius: 2px;
      transition: width 0.2s;
    }

    /* ===== P5 COMBAT: Boss Alert ===== */
    .boss-alert {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 32px;
      background: rgba(15, 12, 25, 0.92);
      border: 1px solid rgba(232, 201, 106, 0.4);
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: #E8C96A;
      text-shadow: 0 0 20px rgba(232, 201, 106, 0.4);
      z-index: 600;
      pointer-events: none;
      animation: bossAlertIn 0.4s ease-out, bossAlertOut 0.6s 3.4s ease-in forwards;
    }

    @keyframes bossAlertIn {
      from {
        opacity: 0;
        transform: translateX(-50%) scale(0.8);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes bossAlertOut {
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
    }

    /* ===== P5 COMBAT: Egg Announcement ===== */
    .egg-announcement {
      padding: 16px 40px;
      background: rgba(15, 12, 25, 0.94);
      border: 2px solid rgba(232, 201, 106, 0.5);
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-size: 20px;
      color: #ECE8E0;
      text-shadow: 0 0 20px rgba(232, 201, 106, 0.3);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s ease-out;
      box-shadow: 0 0 40px rgba(232, 201, 106, 0.15);
    }

    .egg-announcement.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== P5 COMBAT: Auto-Grind Button ===== */
    .auto-grind-btn {
      position: fixed;
      left: 310px;
      bottom: 50px;
      width: 70px;
      height: 36px;
      background: linear-gradient(180deg, rgba(25, 20, 38, 0.92), rgba(15, 12, 25, 0.96));
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 6px;
      color: rgba(200, 195, 185, 0.6);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 160;
    }

    .auto-grind-btn:hover {
      border-color: rgba(232, 201, 106, 0.4);
      color: rgba(232, 201, 106, 0.8);
    }

    .auto-grind-btn.active {
      background: linear-gradient(180deg, rgba(160, 130, 80, 0.25), rgba(100, 80, 50, 0.3));
      border-color: rgba(232, 201, 106, 0.6);
      color: #E8C96A;
      box-shadow: 0 0 12px rgba(232, 201, 106, 0.15);
      animation: autoGrindPulse 2s ease-in-out infinite;
    }

    @keyframes autoGrindPulse {

      0%,
      100% {
        box-shadow: 0 0 8px rgba(232, 201, 106, 0.1);
      }

      50% {
        box-shadow: 0 0 18px rgba(232, 201, 106, 0.3);
      }
    }

    /* ===== SKILL BAR: Slots + CD + Auto-cast ===== */
    .skill-slot {
      width: 42px;
      height: 42px;
      position: relative;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
      overflow: hidden;
    }

    .skill-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
    }

    .skill-slot.auto-cast {
      border-color: rgba(232, 201, 106, 0.5);
      animation: autoCastGlow 2s ease-in-out infinite;
    }

    @keyframes autoCastGlow {

      0%,
      100% {
        box-shadow: 0 0 4px rgba(232, 201, 106, 0.1);
      }

      50% {
        box-shadow: 0 0 10px rgba(232, 201, 106, 0.35);
      }
    }

    .skill-icon {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: rgba(30, 25, 40, 0.5);
    }

    .skill-cd-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      pointer-events: none;
    }

    .skill-cd-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-family: 'Inter', sans-serif;
      pointer-events: none;
      z-index: 2;
    }

    .skill-key-label {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 8px;
      font-weight: 700;
      color: rgba(200, 195, 185, 0.5);
      font-family: 'Inter', sans-serif;
      pointer-events: none;
    }

    .skillbar-label {
      font-size: 8px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.5);
      text-align: center;
      padding: 2px 0;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }

    .skillbar-divider {
      height: 1px;
      margin: 2px 4px;
      background: rgba(160, 130, 80, 0.25);
    }

    .skill-pet-name {
      position: absolute;
      bottom: 1px;
      left: 2px;
      font-size: 7px;
      font-weight: 600;
      color: rgba(232, 201, 106, 0.6);
      font-family: 'Inter', sans-serif;
      pointer-events: none;
    }

    .pet-skill-slot {
      border-color: rgba(160, 130, 80, 0.15);
    }

    /* ===== SKILL PANEL ===== */
    .skill-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      max-height: 85vh;
      z-index: 500;
      animation: panelPopIn 0.25s ease-out;
    }

    @keyframes panelPopIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .skill-equip-slot {
      width: 42px;
      height: 42px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 8px;
    }

    .skill-slot-key {
      color: rgba(232, 201, 106, 0.5);
      font-size: 8px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    .skill-slot-name {
      color: rgba(200, 195, 185, 0.7);
      font-size: 7px;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .skill-mini-icon {
      width: 24px;
      height: 24px;
      background-size: cover;
      background-position: center;
      border-radius: 3px;
    }

    .skill-card {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 5px 8px;
      background: rgba(20, 16, 30, 0.5);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .skill-card:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(232, 201, 106, 0.06);
    }

    .skill-card-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      background-size: cover;
      background-position: center;
      background-color: rgba(30, 25, 40, 0.5);
      border-radius: 4px;
      border: 1px solid rgba(160, 130, 80, 0.2);
    }

    .skill-card-info {
      flex: 1;
      min-width: 0;
    }

    .skill-card-name {
      color: rgba(220, 215, 200, 0.8);
      font-size: 11px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
    }

    .skill-card-stats {
      display: flex;
      gap: 6px;
      font-size: 9px;
      color: rgba(200, 195, 185, 0.5);
      font-family: 'Inter', sans-serif;
    }

    .skill-card-mult {
      color: rgba(232, 201, 106, 0.7);
      font-size: 10px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    /* ===== ZONE TRANSITION ===== */
    .zone-transition {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #0A0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      pointer-events: none;
    }

    .zone-transition.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .zone-transition-name {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      color: #E8C96A;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 2px 12px rgba(232, 201, 106, 0.4);
    }

    .zone-transition-bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .zone-transition-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #E8C96A, #7BA4DB);
      transition: width 0.3s ease;
    }

    /* ===== GATE LABELS ===== */
    .gate-label {
      position: fixed;
      z-index: 140;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.85);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      white-space: nowrap;
      display: none;
      /* positioned by JS */
    }

    /* ===== WORLD MAP PANEL (Premium Split) ===== */
    .wmp-root {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 680px !important;
      max-height: 80vh !important;
      z-index: 300 !important;
      overflow: hidden !important;
    }

    .wmp-body {
      display: flex;
      height: calc(80vh - 36px);
      overflow: hidden;
    }

    /* Left column: zone list */
    .wmp-list {
      width: 260px;
      min-width: 260px;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid rgba(160, 130, 80, 0.15);
      padding: 4px 0;
    }

    .wmp-zone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      gap: 6px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.08);
      transition: background 0.15s;
    }

    .wmp-zone-row:hover {
      background: rgba(160, 130, 80, 0.08);
    }

    .wmp-selected {
      background: rgba(160, 130, 80, 0.15) !important;
      border-left: 2px solid rgba(232, 201, 106, 0.7);
    }

    .wmp-current {
      background: rgba(160, 130, 80, 0.1);
    }

    .wmp-locked {
      opacity: 0.35;
    }

    .wmp-zone-info {
      flex: 1;
      min-width: 0;
    }

    .wmp-zone-top {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .wmp-zone-emoji {
      font-size: 13px;
    }

    .wmp-zone-name {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(220, 215, 200, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wmp-zone-lv {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.45);
      font-family: 'Inter', sans-serif;
      margin-top: 1px;
    }

    .wmp-here {
      font-size: 10px;
      margin-left: 2px;
    }

    .wmp-lock {
      font-size: 9px;
      opacity: 0.5;
      margin-left: 2px;
    }

    /* Teleport button */
    .wmp-teleport-btn {
      flex-shrink: 0;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(232, 201, 106, 0.85), rgba(196, 153, 61, 0.9));
      color: #0A0E1A;
      white-space: nowrap;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .wmp-teleport-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(232, 201, 106, 0.3);
    }

    .wmp-teleport-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .wmp-btn-disabled {
      background: rgba(60, 50, 70, 0.6) !important;
      color: rgba(200, 195, 185, 0.35) !important;
      cursor: default !important;
      box-shadow: none !important;
    }

    /* Right column: zone detail */
    .wmp-detail {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .wmp-detail-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(200, 195, 185, 0.3);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      text-align: center;
    }

    .wmp-detail-header {
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.2);
      margin-bottom: 6px;
    }

    .wmp-detail-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.9);
      letter-spacing: 1px;
      text-shadow: 0 1px 6px rgba(232, 201, 106, 0.2);
    }

    .wmp-detail-sub {
      font-size: 10px;
      color: rgba(200, 195, 185, 0.5);
      margin-top: 2px;
    }

    .wmp-section-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.75);
      margin: 8px 0 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.12);
    }

    /* Monster table */
    .wmp-monster-table {
      font-size: 10px;
      font-family: 'Inter', sans-serif;
    }

    .wmp-mt-header {
      display: grid;
      grid-template-columns: 1fr 36px 52px 44px;
      gap: 4px;
      padding: 2px 4px;
      color: rgba(200, 195, 185, 0.4);
      font-size: 9px;
      font-weight: 600;
      border-bottom: 1px solid rgba(160, 130, 80, 0.1);
    }

    .wmp-mt-row {
      display: grid;
      grid-template-columns: 1fr 36px 52px 44px;
      gap: 4px;
      padding: 3px 4px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.05);
      color: rgba(220, 215, 200, 0.7);
      transition: background 0.1s;
    }

    .wmp-mt-row:hover {
      background: rgba(160, 130, 80, 0.06);
    }

    .wmp-mt-boss {
      background: rgba(232, 201, 106, 0.06) !important;
      border-left: 2px solid rgba(232, 201, 106, 0.4);
    }

    .wmp-mt-boss .wmp-mt-name {
      color: rgba(232, 201, 106, 0.85);
      font-weight: 700;
    }

    .wmp-aggro {
      color: #E74C3C !important;
    }

    .wmp-passive {
      color: rgba(39, 174, 96, 0.8) !important;
    }

    .wmp-mt-lv {
      text-align: center;
    }

    .wmp-mt-egg {
      text-align: center;
      color: rgba(232, 201, 106, 0.6);
    }

    /* Drop list */
    .wmp-drop-list {
      font-size: 10px;
      font-family: 'Inter', sans-serif;
    }

    .wmp-drop-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 4px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.05);
      color: rgba(220, 215, 200, 0.6);
    }

    .wmp-drop-boss {
      background: rgba(232, 201, 106, 0.06);
      border-left: 2px solid rgba(232, 201, 106, 0.3);
    }

    .wmp-drop-rate {
      color: rgba(232, 201, 106, 0.6);
      font-weight: 600;
    }

    /* Footer teleport button */
    .wmp-detail-footer {
      margin-top: 10px;
      text-align: center;
    }

    .wmp-teleport-footer-btn {
      width: 100%;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: linear-gradient(180deg, #E8C96A, #C4993D);
      color: #0A0E1A;
      letter-spacing: 1px;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), 0 0 12px rgba(232, 201, 106, 0.15);
    }

    .wmp-teleport-footer-btn:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 3px 12px rgba(232, 201, 106, 0.3);
    }

    .wmp-teleport-footer-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* ===== P7: INVENTORY PANEL ===== */
    .inv-root {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 400px !important;
      max-height: 80vh !important;
      z-index: 300 !important;
      overflow: hidden !important;
    }

    .inv-gold {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: rgba(232, 201, 106, 0.8);
      font-family: 'Inter', sans-serif;
    }

    .inv-tabs {
      display: flex;
      gap: 3px;
      padding: 4px 8px;
      border-bottom: 1px solid rgba(160, 130, 80, 0.15);
      background: rgba(30, 25, 45, 0.5);
    }

    .inv-tab {
      flex: 1;
      padding: 4px 0;
      font-size: 10px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: 1px solid rgba(160, 130, 80, 0.2);
      background: rgba(20, 16, 30, 0.6);
      color: rgba(200, 195, 185, 0.5);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .inv-tab:hover {
      color: rgba(232, 201, 106, 0.7);
      border-color: rgba(160, 130, 80, 0.35);
    }

    .inv-tab-active {
      background: rgba(160, 130, 80, 0.2) !important;
      color: rgba(232, 201, 106, 0.9) !important;
      border-color: rgba(232, 201, 106, 0.5) !important;
    }

    .inv-sort-btn {
      padding: 4px 8px;
      font-size: 9px;
      font-weight: 600;
      background: rgba(160, 130, 80, 0.15);
      border: 1px solid rgba(160, 130, 80, 0.25);
      color: rgba(200, 195, 185, 0.5);
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .inv-sort-btn:hover {
      color: rgba(232, 201, 106, 0.7);
    }

    .inv-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 8px;
      overflow-y: auto;
      max-height: calc(80vh - 80px);
    }

    .inv-slot {
      aspect-ratio: 1;
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.15);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: default;
    }

    .inv-slot-filled {
      cursor: pointer;
    }

    .inv-slot-filled:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(160, 130, 80, 0.1);
    }

    .inv-icon {
      font-size: 20px;
    }

    .inv-qty {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 8px;
      font-weight: 700;
      color: rgba(220, 215, 200, 0.7);
      font-family: 'Inter', sans-serif;
    }

    /* Tooltip */
    .inv-tooltip {
      position: absolute;
      background: rgba(15, 12, 25, 0.96);
      border: 1px solid rgba(160, 130, 80, 0.4);
      border-radius: 5px;
      padding: 8px 10px;
      z-index: 310;
      min-width: 150px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .inv-tt-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .inv-tt-rarity {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.4);
      margin-bottom: 4px;
    }

    .inv-tt-desc {
      font-size: 10px;
      color: rgba(200, 195, 185, 0.6);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .inv-tt-qty {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.4);
      margin-bottom: 6px;
    }

    .inv-tt-actions {
      display: flex;
      gap: 4px;
    }

    .inv-tt-btn {
      flex: 1;
      padding: 4px 0;
      font-size: 9px;
      font-weight: 700;
      border: 1px solid rgba(160, 130, 80, 0.3);
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      background: rgba(160, 130, 80, 0.12);
      color: rgba(200, 195, 185, 0.6);
      transition: all 0.15s;
    }

    .inv-tt-btn:hover {
      background: rgba(160, 130, 80, 0.25);
      color: rgba(232, 201, 106, 0.9);
    }

    .inv-discard-btn:hover {
      background: rgba(200, 50, 50, 0.3) !important;
      color: #E74C3C !important;
    }

    /* ===== P7: AFK PANEL ===== */
    .afk-root {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 300px !important;
      z-index: 300 !important;
      overflow: hidden !important;
    }

    .afk-body {
      padding: 8px 12px;
    }

    .afk-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(160, 130, 80, 0.08);
    }

    .afk-label {
      font-size: 11px;
      color: rgba(200, 195, 185, 0.6);
      font-family: 'Inter', sans-serif;
    }

    .afk-value {
      font-size: 12px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.85);
      font-family: 'Inter', sans-serif;
    }

    .afk-dps .afk-value {
      color: #E74C3C;
    }

    /* ===== P7: PICKUP TEXT ===== */
    .pickup-text {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, 0);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.9);
      pointer-events: none;
      z-index: 250;
      opacity: 0;
      transition: opacity 0.2s, transform 0.8s;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .pickup-text.show {
      opacity: 1;
      transform: translate(-50%, -30px);
    }

    /* ===== P8: EQUIPMENT PANEL ===== */
    .eq-root {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 380px !important;
      max-height: 85vh !important;
      z-index: 300 !important;
      overflow: hidden !important;
    }

      padding: 8px;
      overflow-y: auto;
      max-height: calc(85vh - 42px);

    .eq-set-summary {
      padding: 4px 8px;
      margin-bottom: 6px;
      background: rgba(160, 130, 80, 0.08);
      border-radius: 4px;
      border: 1px solid rgba(160, 130, 80, 0.15);
    }

    .eq-set-line {
      font-size: 10px;
      color: rgba(232, 201, 106, 0.8);
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      padding: 2px 0;
    }

    .eq-stats-bar {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(200, 195, 185, 0.7);
      margin-bottom: 6px;
      font-family: 'Inter', sans-serif;
    }

    .eq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
    }

    .eq-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .eq-slot {
      background: rgba(20, 16, 30, 0.6);
      border: 1px solid rgba(160, 130, 80, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .eq-slot:hover {
      border-color: rgba(232, 201, 106, 0.4);
      background: rgba(160, 130, 80, 0.08);
    }

    .eq-spacer {
      background: rgba(20, 16, 30, 0.25);
      border-radius: 50%;
      border: 1px dashed rgba(160, 130, 80, 0.1);
    }

    .eq-item-icon {
      font-size: 22px;
    }

    .eq-enhance {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 9px;
      font-weight: 700;
      color: rgba(232, 201, 106, 0.9);
      font-family: 'Inter', sans-serif;
    }

    .eq-empty-icon {
      font-size: 18px;
      opacity: 0.3;
    }

    .eq-slot-label {
      font-size: 8px;
      color: rgba(200, 195, 185, 0.3);
      font-family: 'Inter', sans-serif;
    }

    .eq-demo-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px 0;
      font-size: 11px;
    }

    .eq-action-popup {
      position: relative;
      margin-top: 8px;
      padding: 10px;
      background: rgba(15, 12, 25, 0.96);
      border: 1px solid rgba(160, 130, 80, 0.4);
      border-radius: 5px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .eq-act-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .eq-act-stats {
      font-size: 10px;
      color: rgba(200, 195, 185, 0.6);
      margin-bottom: 3px;
    }

    .eq-act-set {
      font-size: 9px;
      color: rgba(232, 201, 106, 0.6);
      margin-bottom: 3px;
    }

    .eq-act-enhance-info {
      font-size: 9px;
      color: rgba(200, 195, 185, 0.4);
